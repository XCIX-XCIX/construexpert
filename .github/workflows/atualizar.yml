name: Atualizar termômetro
on:
  schedule:
    - cron: "23 10 * * *"   # todo dia, 7h23 em Brasília
  workflow_dispatch: {}      # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]
    paths: ["manual.json", "scripts/**", ".github/workflows/**"]   # recalcula quando os dados manuais ou o código mudam
permissions:
  contents: write
concurrency: atualizar
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/coleta_ce.py --manual manual.json --saida termometro/dados.json
      - run: |
          git config user.name "termometro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add termometro/dados.json
          git diff --cached --quiet || git commit -m "Termômetro: dados de $(date -u +%F)"
          git push
